[profile.default]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
additional_compiler_profiles = [{ name = "monad", optimizer = true, optimizer_runs = 10000 }]
compilation_restrictions = [{ paths = "src/monad/StakingLens.sol", optimizer_runs = 10000 }]

[profile.ci]

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"
avalanche = "${AVALANCHE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[lint]
exclude_lints = ["calls-loop"]
